[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ucs-guestscreen-ad-manager"
version = "0.1.0"
description = "Centralized UCS GuestScreen Advertising Content Management System"
authors = ["POS Engineering Team <pos-admin@retail.local>"]
readme = "README.md"
packages = [{include = "src", from = "."}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
sqlalchemy = ">=2.0.32"
asyncpg = ">=0.29.0"
asyncssh = ">=2.17.0"
pydantic = ">=2.8.0"
pydantic-settings = ">=2.4.0"
cryptography = ">=43.0.0"
alembic = ">=1.13.2"
pillow = ">=10.4.0"
httpx = ">=0.27.0"
python-multipart = ">=0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.23.8"
pytest-cov = ">=5.0.0"
aiosqlite = ">=0.20.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_cashbox: tests targeting physical cashier monoblock 10.0.0.241",
    "integration: database and service integration tests",
    "unit: fast isolated unit tests"
]
